name: Retouch

options:
  bundleIdPrefix: com.seudominio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Retouch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Retouch
        excludes:
          - "README.md"
          - "Info.plist.example"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Retouch
        PRODUCT_BUNDLE_IDENTIFIER: com.seudominio.retouch
        INFOPLIST_FILE: Retouch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
